services:
  ai-gateway:
    build: .
    container_name: ai-gateway
    restart: unless-stopped
    ports:
      - "18080:80"
    env_file:
      - path: .env
        required: false
    environment:
      MANIFEST_URL: ${MANIFEST_URL:-http://ai-manager:80/manifest.json}
      MANIFEST_POLLING_INTERVAL: ${MANIFEST_POLLING_INTERVAL:-5m}
      DEBUG: ${DEBUG:-false}
    command: ["--manifest", "/app/manifest.json"]
    volumes:
      - ./manifest.json:/app/manifest.json:ro
      - ./debug.log:/app/debug.log
    networks:
      - dev

networks:
  dev:
    external: true
